name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  release-workflow:
    name: Release workflow tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Check release metadata consistency (tag target)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: python scripts/check_release_consistency.py --repo "${{ github.repository }}" --tag "$GITHUB_REF_NAME"
      - name: Check release metadata consistency (README)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: python scripts/check_release_consistency.py --repo "${{ github.repository }}"
      - name: Verify README against latest stable GitHub Release
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/releases/latest" > "$RUNNER_TEMP/latest-release.json"; then
            python scripts/check_release_consistency.py \
              --repo "${{ github.repository }}" \
              --release-json "$RUNNER_TEMP/latest-release.json" \
              --require-remote
          else
            echo "::warning::GitHub Releases API unavailable; remote release metadata was not verified."
          fi

  backend:
    name: Backend tests and lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: qbot-test-postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+asyncpg://postgres:qbot-test-postgres@127.0.0.1:5432/postgres
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
      REDIS_TEST_URL: redis://127.0.0.1:6379/14
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m pip_audit -r requirements.txt
      - run: python -m compileall -q app tests migrations
      - run: python -m pytest -q
      - run: python -m ruff check app tests migrations

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  containers:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --no-env-resolution --quiet
      - name: Exercise the packaged services through Nginx
        run: python3 scripts/smoke_compose.py

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
