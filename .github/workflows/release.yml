name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml

  package:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check release branch and versions
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python3 scripts/prepare_release.py --tag "$VERSION" --notes-output "$RUNNER_TEMP/notes.md"
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build management console
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Package and check assets
        run: |
          prefix="qbot-ai-${VERSION#v}"
          mkdir release
          git archive --format=tar.gz --prefix="$prefix/" HEAD > "release/$prefix.tar.gz"
          python3 scripts/package_server.py --output "release/$prefix.zip"
          python3 scripts/package_native.py --tag "$VERSION" --output "release/$prefix-native.tar.gz"
          python3 -m zipfile --test "release/$prefix.zip"
          tar -tzf "release/$prefix.tar.gz" >/dev/null
          tar -tzf "release/$prefix-native.tar.gz" >/dev/null
          cp "$RUNNER_TEMP/notes.md" release/notes.md
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-input
          path: release/
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: release-input
          path: release/
      - name: Create and verify SHA-256 manifest
        working-directory: release
        run: |
          sha256sum qbot-ai-*.tar.gz qbot-ai-*.zip > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Sign build provenance
        id: provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: |
            release/qbot-ai-*.tar.gz
            release/qbot-ai-*.zip
            release/SHA256SUMS
      - name: Verify publisher signatures
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
        working-directory: release
        run: |
          cp "$BUNDLE" provenance.sigstore.json
          test "$(stat -c%s provenance.sigstore.json)" -le $((16 * 1024 * 1024))
          for asset in qbot-ai-*.tar.gz qbot-ai-*.zip SHA256SUMS; do
            gh attestation verify "$asset" --repo "$GH_REPO" --bundle provenance.sigstore.json \
              --signer-workflow "$GH_REPO/.github/workflows/release.yml" --source-ref "$GITHUB_REF" \
              --deny-self-hosted-runners
          done
      - name: Verify release inputs and publish by release ID
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_release.py --tag "$VERSION" --assets-dir release/
