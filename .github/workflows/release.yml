name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    name: Verify, package and publish release assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Validate versions and release notes
        env:
          VERSION: ${{ github.ref_name }}
        run: python scripts/prepare_release.py --tag "${VERSION}" --notes-output "${RUNNER_TEMP}/qbot-release-notes.md"
      - name: Backend verification
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pytest -q
          python -m ruff check app tests
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend verification
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Docker build verification
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          docker build --tag qbot-backend:${VERSION} backend
          docker build --tag qbot-frontend:${VERSION} frontend
      - name: Package source and checksums
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must match vMAJOR.MINOR.PATCH: ${VERSION}"
            exit 1
          fi
          VERSION_NUMBER="${VERSION#v}"
          mkdir -p release
          git archive --format=tar.gz --prefix="qbot-ai-${VERSION_NUMBER}/" "${GITHUB_SHA}" > "release/qbot-ai-${VERSION_NUMBER}.tar.gz"
          python scripts/package_server.py --output "release/qbot-ai-${VERSION_NUMBER}.zip"
          cd release
          sha256sum qbot-ai-*.tar.gz qbot-ai-*.zip > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "${VERSION}" release/* \
            --verify-tag \
            --title "QBot AI ${VERSION}" \
            --notes-file "${RUNNER_TEMP}/qbot-release-notes.md" \
            --latest
