upstream qbot_backend {
    server backend:8000;
    keepalive 32;
}

# 前端静态资源由 frontend 容器（nginx:alpine + dist）提供，
# 本容器只做反向代理，不能自己 root 到本机 html 目录，否则会返回镜像自带的默认欢迎页。
upstream qbot_frontend {
    server frontend:80;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # WebSocket endpoints are under /api/ws/* in the FastAPI router.
    # Keep this location before the generic /api/ proxy so Upgrade is preserved.
    location /api/ws/ {
        proxy_pass http://qbot_backend/api/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://qbot_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # QQ 官方机器人 Webhook 回调：兼容把回调地址直接填成 https://域名/webhook。
    # 正式路径为 /api/qqbot/webhook/{app_id}，由上面的 /api/ 通用代理覆盖。
    location = /webhook {
        proxy_pass http://qbot_backend/webhook;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Backward-compatible path for deployments that expose /ws/* directly.
    location /ws/ {
        proxy_pass http://qbot_backend/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # SPA 入口：全部交给前端容器，由它做 try_files 回溯到 /index.html。
    location / {
        proxy_pass http://qbot_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
